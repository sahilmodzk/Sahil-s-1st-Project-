services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gather
      POSTGRES_PASSWORD: gather_dev_only
      POSTGRES_DB: gather
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - gather_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gather -d gather"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  gather_postgres:
